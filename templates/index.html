<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversational Image Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body><main class="app">
<header><h1>Conversational Image Chatbot 🤖</h1><p>Upload an image and ask me anything about it!</p></header>
<section class="workspace">
<div class="upload">
<div class="preview"><span id="empty">Your image preview will appear here</span><img id="preview" alt="Selected image"></div>
<label class="choose">Choose an Image<input id="image" type="file" accept="image/*" hidden></label>
<div id="name"></div>
</div>
<div class="chat"><div id="messages"><div class="msg bot">Upload an image, then ask a question.</div></div>
<form id="form"><input id="question" placeholder="Great! Now ask a question." autocomplete="off"><button>➤</button></form></div>
</section><footer>Powered by Flask &amp; Hugging Face</footer>
</main><script src="{{ url_for('static', filename='script.js') }}"></script></body></html>
